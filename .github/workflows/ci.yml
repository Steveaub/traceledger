name: Tests and retrieval regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install '.[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/voice.test.cjs
      - run: python -m ruff format --check atlas scripts tests
      - run: python -m ruff check atlas scripts tests
      - name: Minimal install optional AI recovery
        run: python -m pytest -q tests/test_publication.py -k optional_generation
      - uses: actions/cache@v4
        with:
          path: models
          key: atlas-models-${{ hashFiles('config/model-manifest.json') }}
      - run: python scripts/bootstrap_models.py --retrieval-only
      - run: python -m pytest -q
      - run: python scripts/regression.py
      - run: python scripts/evaluate_investigator.py --split test --check
