[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-ledger-rag"
version = "0.1.0"
description = "Measured, evidence-first project intelligence"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1", "numpy==2.5.3", "fastembed==0.8.0", "rank-bm25==0.2.2", "networkx==3.6.1", "pypdf==6.18.1", "beautifulsoup4==4.15.0", "tenacity==9.1.4", "pydantic-settings==2.15.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.12.12"]
generation = ["transformers>=4.46,<5", "torch>=2.5", "sentencepiece>=0.2"]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
